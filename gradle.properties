kotlin.code.style=official
kotlin.version=2.2.0
kotlin.incremental=true

org.gradle.jvmargs=\
  -Duser.language=en\
  \ -Duser.country=US\
  \ -Xmx2g -XX:MaxMetaspaceSize=512m\
  \ -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:InitiatingHeapOccupancyPercent=45\
  \ -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=320m\
  \ -XX:+HeapDumpOnOutOfMemoryError\
  \ -Dfile.encoding=UTF-8\
  \ -Dsun.zip.disableMemoryMapping=true\
  \ -Dkotlinx.coroutines.debug=off\
  \ --add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED\
  \ --add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED\
  \ --add-opens=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED\
  \ --add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED\
  \ --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED\
  \ --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED\
  \ --add-exports=java.base/sun.nio.ch=ALL-UNNAMED

# Rich output only if needed
org.gradle.console=auto

# Gradle daemon
org.gradle.daemon=true

# Configuration cache (disabled for CI/constrained env)
org.gradle.configuration-cache=false
#org.gradle.configuration-cache.parallel=true

# Configure on-demand
org.gradle.configureondemand=true

# Parallel execution (disabled - single core)
org.gradle.parallel=false

# Reuse task outputs
org.gradle.caching=true

# Fully disables the problematic metrics feature
kotlin.internal.metricsEnabled=false

# Isolated projects
#org.gradle.unsafe.isolated-projects=true

# Use OS-native file change notifications
org.gradle.vfs.watch=true

# Disable Gradle's annotation processing
#kapt.use.worker.api=false
#org.gradle.annotation.processing.enabled=false
